{
  "id": "spec-3bbadf7cb904",
  "pair": "spec-3bbadf7cb904",
  "version": 1,
  "input_space": {
    "role": [
      "admin",
      "reader"
    ],
    "suspended": [
      true,
      false
    ]
  },
  "default": "deny",
  "rules": [
    {
      "id": "A",
      "quote": "Admins can open the dashboard, no extra checks.",
      "when": {
        "role": {
          "eq": "admin"
        }
      },
      "action": "allow",
      "text": "Admins can open the dashboard, no extra checks."
    },
    {
      "id": "B",
      "quote": "Also, A suspended account must be denied dashboard access.",
      "when": {
        "suspended": {
          "eq": true
        }
      },
      "action": "deny",
      "text": "Also, A suspended account must be denied dashboard access."
    }
  ],
  "default_source": {
    "quote": "For anything not covered above, deny access.",
    "action": "deny"
  },
  "spec_origin": {
