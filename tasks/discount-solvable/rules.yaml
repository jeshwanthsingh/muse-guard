{
  "id": "discount-solvable",
  "pair": "discount",
  "version": 1,
  "default": "no_discount",
  "rules": [
    {
      "id": "A",
      "text": "Apply a 20 percent discount when subtotal is at least 100. Applies only when clearance is false.",
      "when": {
        "subtotal": {
          "gte": 100
        },
        "clearance": {
          "eq": false
        }
      },
      "action": "discount_20"
    },
    {
      "id": "B",
      "text": "Never discount clearance items.",
      "when": {
        "clearance": {
          "eq": true
        }
      },
      "action": "no_discount"
    }
  ]
}
